# .github/workflows/redirects.yml
# A pull request shows the link changes as a plan comment; merging to main applies them.
# Secret: REDIRHUB_API_TOKEN. Keep the state in a remote backend (S3, HCP Terraform, ...).
# Every create carries an Idempotency-Key, so a job retried after a timeout creates nothing twice.
name: Redirects
on:
  pull_request:
    paths: ['redirects/**']
  push:
    branches: [main]
    paths: ['redirects/**']
permissions:
  contents: read
  pull-requests: write
concurrency: redirects
jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # with pipefail, so a failed plan fails the step despite the tee
        working-directory: redirects
    env:
      REDIRHUB_API_TOKEN: ${{ secrets.REDIRHUB_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform init -input=false
      - run: terraform fmt -check
      - run: terraform validate
      - run: terraform plan -input=false -no-color -out=tfplan | tee plan.txt
      - if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const plan = require('fs').readFileSync('redirects/plan.txt', 'utf8');
            const body = '#### Link changes\n```\n' + plan.slice(-60000) + '\n```';
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
      - if: github.event_name == 'push'
        run: terraform apply -input=false tfplan
